[project]
name = "py-llm-wiki"
version = "0.1.0"
description = "Python/FastAPI port of llm_wiki — a personal knowledge base that builds itself"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
    "real_llm: integration tests that call a real LLM provider (env LLM_WIKI_REAL_LLM=1)",
]

[tool.setuptools]
packages = { find = { include = ["backend*"] } }
